name: deploy

# The deploy gate is the security gate. Typecheck, unit tests and the policy
# suite all run before the publish step and all fail the workflow. A deploy that
# skipped them is a deploy that could publish an open database.
#
# No secret is needed to build this app. The backend URL and the publishable key
# end up in the bundle either way, so they are repository VARIABLES:
#   Settings → Secrets and variables → Actions → Variables
#     VITE_SUPABASE_URL
#     VITE_SUPABASE_PUBLISHABLE_KEY

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default; the deploy job widens this for itself and nothing else.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, policy suite, build
    runs-on: ubuntu-latest
    steps:
      # TODO before this repository goes public: pin every action to a commit
      # hash rather than a moving tag (blueprint §15, layer 08). Get them with
      #   gh api repos/actions/checkout/commits/v5 --jq .sha
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      # Clean install from the committed lockfile. Never `npm install` in CI.
      - name: Install
        run: npm ci

      # First, and needing nothing installed: the workflow checking its own
      # supply chain. A mutable ref means the action that runs tomorrow need
      # not be the one reviewed today, and a build at a release tag cannot be
      # reproduced.
      - name: Every action is pinned to a commit
        run: bash scripts/check-actions-pinned.sh

      - name: Typecheck
        run: npm run typecheck

      # The design and the code restate one palette in four files. This is the
      # only part of "does the app match the design" a machine can answer, so
      # it answers that part and leaves the rest to a person reading both.
      - name: Design and code still describe each other
        run: npm run check:design

      # Cheap, and before anything needs a container: a fixture id with a
      # letter outside a–f is rejected only once a database is up, and that
      # mistake has cost this repository four CI rounds.
      - name: SQL fixture ids are valid UUIDs
        run: npm run check:sql

      - name: Unit tests
        run: npm run test:unit

      # ---- suite two: the policies -------------------------------------------
      #
      # These gate the deploy. Policy bugs are the single most likely way this
      # app leaks, so they get the same rigour as the tax arithmetic.

      - name: Set up the Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: latest

      - name: Start a local stack, applying every migration
        run: supabase start -x studio,inbucket,imgproxy,edge-runtime,logflare,vector

      - name: Policy tests
        run: supabase test db

      # The seed is a long hand-written INSERT script against a schema that
      # keeps moving, and nothing else in the pipeline loads it. Run it at a
      # throwaway household and check the awkward cases actually landed.
      - name: The demo seed still fits the schema
        run: bash scripts/check-demo-seed.sh

      - name: Stop the stack
        if: always()
        run: supabase stop --no-backup

      # ---- build --------------------------------------------------------------

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          # Pages serves at /<repo>/. A custom domain later means setting this
          # to "/" and nothing else changes.
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      # The last thing before anything is published: prove no privileged key is
      # in what we are about to put on the public internet.
      - name: No privileged key in the build output
        run: bash scripts/check-no-secret-key.sh dist

      # A rule can be correct in base.css and absent from the stylesheet that
      # ships, because Tailwind drops component rules whose class name it
      # cannot find written out in the source. That shipped once, silently.
      - name: Component classes survived the build
        run: bash scripts/check-component-classes.sh dist

      - name: Upload the site
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    name: Publish to Pages
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Widened here and only here. id-token is for the short-lived deployment
    # token — no stored credential is involved.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
