name: deploy

# The deploy gate is the security gate. Typecheck, unit tests and the policy
# suite all run before the publish step and all fail the workflow. A deploy that
# skipped them is a deploy that could publish an open database.
#
# No secret is needed to build this app. The backend URL and the publishable key
# end up in the bundle either way, so they are repository VARIABLES:
#   Settings → Secrets and variables → Actions → Variables
#     VITE_SUPABASE_URL
#     VITE_SUPABASE_PUBLISHABLE_KEY

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default; the deploy job widens this for itself and nothing else.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, policy suite, build
    runs-on: ubuntu-latest
    steps:
      # TODO before this repository goes public: pin every action to a commit
      # hash rather than a moving tag (blueprint §15, layer 08). Get them with
      #   gh api repos/actions/checkout/commits/v5 --jq .sha
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Clean install from the committed lockfile. Never `npm install` in CI.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      # ---- suite two: the policies -------------------------------------------
      #
      # These gate the deploy. Policy bugs are the single most likely way this
      # app leaks, so they get the same rigour as the tax arithmetic.

      - name: Set up the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start a local stack, applying every migration
        run: supabase start -x studio,inbucket,imgproxy,edge-runtime,logflare,vector

      - name: Policy tests
        run: supabase test db

      - name: Stop the stack
        if: always()
        run: supabase stop --no-backup

      # ---- build --------------------------------------------------------------

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          # Pages serves at /<repo>/. A custom domain later means setting this
          # to "/" and nothing else changes.
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      # The last thing before anything is published: prove no privileged key is
      # in what we are about to put on the public internet.
      - name: No privileged key in the build output
        run: bash scripts/check-no-secret-key.sh dist

      - name: Upload the site
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publish to Pages
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Widened here and only here. id-token is for the short-lived deployment
    # token — no stored credential is involved.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
