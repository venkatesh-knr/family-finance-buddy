<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- No cross-origin referrers, ever. -->
    <meta name="referrer" content="no-referrer" />

    <!--
      The content-security policy is injected at build time from the backend
      origin — see the plugin in vite.config.ts, which is the single source of
      truth for it. It is not written here because the origin is configuration.
    -->

    <!--
      Installable as its own icon, not a browser tab. Relative paths throughout,
      so this keeps working if VITE_BASE changes for a custom domain.

      This is a web app in a standalone window, not the native shell. Biometric
      unlock, push, camera receipts and offline entry are what make it a real
      app, and they arrive with Capacitor in phase 2 (docs/blueprint.md §797,
      §1100) — the store's minimum-functionality rule refuses a wrapped page.
    -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0b0f14" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Finance Buddy" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>Family Finance Buddy</title>
    <meta
      name="description"
      content="Family Finance Buddy — expenses, investments, property and tax for one household."
    />

    <!--
      Three faces, three jobs (docs/tokens.md §3). Newsreader for titles, Public
      Sans for everything read as prose, IBM Plex Mono for every number.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Finance Buddy needs JavaScript. It is a single-page app with no server behind it.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
